<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Produk_lokal by kopia</title>
  <meta name="description" content="Dashboard Manajemen Admin UMKM & Direct Commerce Produk_lokal by kopia">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet">

  <!-- Stylesheet Admin -->
  <link rel="stylesheet" href="admin.css">

  <!-- Firebase SDKs (Compat CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Modular Services -->
  <script src="services/firebase.js"></script>

  <!-- Reusable UI Components -->
  <script src="components/toast.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/statCard.js"></script>
  <script src="components/productModal.js"></script>
  <script src="components/deleteConfirmModal.js"></script>

  <!-- Page Components -->
  <script src="pages/loginPage.js"></script>
  <script src="pages/dashboardPage.js"></script>
  <script src="pages/productsPage.js"></script>
  <script src="pages/leadsPage.js"></script>

  <!-- Admin Controller Application Script -->
  <script src="admin.js" defer></script>
</head>

<body>
  <!-- Container Root Dinamis: Akan diisi oleh admin.js -->
  <div id="adminAppRoot">
    <!-- Loading Screen Awal -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; font-family: var(--font-main);">
      <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #e2e8f0; border-top-color: #0f766e; animation: spin 1s infinite linear;"></div>
      <p style="font-size: 14px; font-weight: 600; color: #64748b;">Menyiapkan Portal Admin Kopia...</p>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>

</html>
